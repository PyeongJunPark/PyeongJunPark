<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">PyeongJun Park — From curiosity to code.</title>
  <desc id="desc">A charcoal and sage green profile cover with oversized typography and an abstract orbital illustration.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#b9cebb" opacity=".10"/></pattern>
    <radialGradient id="halo"><stop stop-color="#8db09a" stop-opacity=".19"/><stop offset="1" stop-color="#8db09a" stop-opacity="0"/></radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d0edb4"/><stop offset="1" stop-color="#648c78"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="440" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="#17231f"/>
    <rect width="1200" height="440" fill="url(#dots)"/>
    <circle cx="944" cy="213" r="305" fill="url(#halo)"/>
    <path d="M64 81H1136" stroke="#98b5a3" opacity=".24"/>
    <circle cx="71" cy="48" r="5" fill="#c9efa4"/>
    <text x="88" y="53" font-family="'Segoe UI',Arial,sans-serif" font-size="15" letter-spacing="3" fill="#c3d1c6">PYEONGJUN PARK</text>
    <text x="1136" y="53" text-anchor="end" font-family="Consolas,monospace" font-size="14" letter-spacing="2" fill="#a3b7a9">SOFTWARE / AI / PLAY</text>
    <text x="60" y="197" font-family="'Segoe UI',Arial,sans-serif" font-size="103" font-weight="600" letter-spacing="-5" fill="#f5f3e9">PyeongJun</text>
    <text x="64" y="306" font-family="Georgia,'Times New Roman',serif" font-size="112" font-style="italic" letter-spacing="-5" fill="#c9efa4">Park.</text>
    <text x="68" y="373" font-family="'Segoe UI',Arial,sans-serif" font-size="25" letter-spacing=".3" fill="#c3d1c6">From curiosity to code.</text>
    <g transform="translate(956 221)" fill="none" stroke="url(#orbit)" stroke-width="1.3">
      <circle r="119" opacity=".30"/>
      <circle r="153" stroke-dasharray="2 10" opacity=".35"/>
      <ellipse rx="164" ry="62" transform="rotate(-35)"/>
      <ellipse rx="164" ry="62" transform="rotate(25)" opacity=".85"/>
      <ellipse rx="164" ry="62" transform="rotate(85)" opacity=".70"/>
      <circle r="31" fill="#c9efa4" fill-opacity=".06" stroke-opacity=".4"/>
      <path d="M0-18V18M-18 0H18M-12-12L12 12M12-12L-12 12" stroke="#e0f5c9" stroke-width="2"/>
      <circle cx="135" cy="-83" r="8" fill="#c9efa4" stroke="#17231f" stroke-width="5"/>
      <circle cx="-111" cy="-100" r="5" fill="#b7cdbf" stroke="#17231f" stroke-width="3"/>
      <circle cx="17" cy="153" r="6" fill="#c9efa4" stroke="#17231f" stroke-width="4"/>
    </g>
    <text x="956" y="414" text-anchor="middle" font-family="Consolas,monospace" font-size="12" letter-spacing="3" fill="#8fa99b">LEARN · BUILD · ITERATE</text>
